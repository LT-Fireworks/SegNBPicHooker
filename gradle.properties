android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Gradle 守护进程的 JDK 由 gradle/gradle-daemon-jvm.properties 指定为 25：
# 本机 PATH 里的 JDK 27 太新，Gradle 9.x 的 Groovy 读不了它生成的类文件
# （Unsupported class file major version 71）。
# 若本机没有 JDK 25，可在下面直接指一个 17~25 的 JDK（Android Studio 也会读写这一项）：
# org.gradle.java.home=D\:/Android/Android\ Studio/jbr

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
